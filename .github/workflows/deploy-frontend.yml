name: Deploy do frontend

# Pipeline de releases imutáveis do frontend (contrato em .github/scripts/frontend_release.py).
# Automático: push na main publica somente a árvore comprovadamente testada pelos quatro checks do PR integrado.
# O gate consulta PR, CI e commits Git; build/validação da release não repetem as suítes completas do CI.
# Manual (workflow_dispatch na main, para recuperação e para a migração inicial da C7.3): prepare (padrão, sem AWS),
# verify, publish, activate, rollback e deploy. Nenhum input escolhe commit: main é sempre o commit desta execução,
# e baseline é a constante revisada em .github/release/baseline.json.
# Toda operação passa pelo job gate (sem credenciais), que decide operation, source e o SHA esperado (outputs usados
# pelos jobs seguintes), e por jobs no environment production, restrito à main e sem revisor obrigatório. As
# operações com AWS usam OIDC (id-token: write só nesses jobs) e nunca chaves permanentes.
# O HEAD atual da main é relido no GitHub três vezes: no gate (A), no primeiro passo de cada job do environment (B)
# e nos scripts, imediatamente antes da primeira escrita AWS (C). Se a main avançou, a execução é recusada sem
# alterar nada: o commit mais novo tem o próprio deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "prepare (sem AWS) | verify (leituras; sonda opcional) | publish | activate | rollback | deploy (publish + activate)"
        type: choice
        options: [prepare, verify, publish, activate, rollback, deploy]
        default: prepare
        required: true
      source:
        description: "prepare/publish/deploy: main (commit desta execução) ou baseline (C7.3 fixada em baseline.json)"
        type: choice
        options: [main, baseline]
        default: main
        required: true
      expected_main_sha:
        description: "SHA completo da main revisado pelo operador; precisa ser o commit desta execução"
        type: string
        required: true
      approved_release_id:
        description: "Release moderna previamente revisada (obrigatória em publish/deploy manuais com source=main)"
        required: false
        type: string
      approved_manifest_sha256:
        description: "SHA-256 completo dos bytes do manifest.json aprovado (publish/deploy manuais da main)"
        required: false
        type: string
      release_id:
        description: "activate/rollback: release já publicada (<12 hex>-<12 hex>)"
        type: string
        default: ""
      expected_active_release:
        description: "Release ativa conferida pelo operador (id ou legacy); obrigatória no rollback"
        type: string
        default: ""
      confirm_release_id:
        description: "rollback com contrato OpenAPI diferente: repetir o release_id alvo"
        type: string
        default: ""
      allow_config_change:
        description: "prepare/publish/deploy: aceitar config diferente da publicada em /config.json"
        type: boolean
        default: false
      s3_probe:
        description: "verify: sonda S3 em releases/_probe/ (nunca altera o index.html)"
        type: boolean
        default: false

permissions: {}

# Uma operação por vez em produção; uma execução em andamento nunca é cancelada por outra.
concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (evento, main, SHA, CI, environment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Valores validados pelo gate. No automático não há inputs: operation=deploy, source=main e o commit integrado.
    outputs:
      operation: ${{ steps.gate.outputs.operation }}
      source: ${{ steps.gate.outputs.source }}
      expected-main-sha: ${{ steps.gate.outputs.expected-main-sha }}
      approved-release-id: ${{ steps.gate.outputs.approved-release-id }}
      approved-manifest-sha256: ${{ steps.gate.outputs.approved-manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: gate
        name: Pré-condições do repositório
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          SOURCE: ${{ inputs.source }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          APPROVED_RELEASE_ID: ${{ inputs.approved_release_id }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          S3_PROBE: ${{ inputs.s3_probe }}
          DEPLOY_ENABLED: ${{ vars.FRONTEND_DEPLOY_ENABLED }}
        run: python3 -B .github/scripts/check-deploy-gate.py --stage repository

  # prepare, publish e deploy: empacota e valida sem credenciais; publish e deploy seguem no job publish (com OIDC).
  build:
    name: Preparar e validar a release (sem AWS)
    needs: gate
    if: needs.gate.outputs.operation == 'prepare' || needs.gate.outputs.operation == 'publish' || needs.gate.outputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      OPERATION: ${{ needs.gate.outputs.operation }}
      SOURCE: ${{ needs.gate.outputs.source }}
      EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
      APPROVED_RELEASE_ID: ${{ needs.gate.outputs.approved-release-id }}
      APPROVED_MANIFEST_SHA256: ${{ needs.gate.outputs.approved-manifest-sha256 }}
    permissions:
      contents: read
    outputs:
      release-id: ${{ steps.build.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Variables do environment, sem chaves AWS estáticas, HEAD atual da main
        env:
          OPERATION: ${{ needs.gate.outputs.operation }}
          SOURCE: ${{ needs.gate.outputs.source }}
          EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          FRONTEND_CONFIG_JSON: ${{ vars.FRONTEND_CONFIG_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python3 -B .github/scripts/check-deploy-gate.py --stage environment
      - id: build
        uses: ./.github/actions/build-frontend
        with:
          source: ${{ needs.gate.outputs.source }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
          config-json: ${{ vars.FRONTEND_CONFIG_JSON }}
          out-dir: ${{ runner.temp }}/releases
      - uses: ./.github/actions/validate-release
        with:
          release-dir: ${{ steps.build.outputs.release-dir }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
          allow-config-change: ${{ inputs.allow_config_change }}
      - name: Vincula a construção à aprovação externa, sem AWS
        env:
          RELEASE_DIR: ${{ steps.build.outputs.release-dir }}
          BUILT_RELEASE_ID: ${{ steps.build.outputs.release-id }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: python3 -B .github/scripts/check-publication-approval.py --release-dir "$RELEASE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.build.outputs.release-id }}
          path: ${{ steps.build.outputs.release-dir }}
          if-no-files-found: error
          retention-days: 30

  # publish: envia releases/<id>/ e não ativa. deploy: envia e, na mesma sessão OIDC, ativa a release recém-publicada
  # (ponteiro com If-Match, invalidação de / e /index.html, espera da invalidação e smoke no domínio público).
  publish:
    name: Publicar releases/<id>/ (e ativar, no deploy)
    needs: [gate, build]
    if: needs.gate.outputs.operation == 'publish' || needs.gate.outputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      OPERATION: ${{ needs.gate.outputs.operation }}
      SOURCE: ${{ needs.gate.outputs.source }}
      EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
      APPROVED_RELEASE_ID: ${{ needs.gate.outputs.approved-release-id }}
      APPROVED_MANIFEST_SHA256: ${{ needs.gate.outputs.approved-manifest-sha256 }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Histórico completo: a ativação do deploy confere a ancestralidade da release na main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Variables do environment, sem chaves AWS estáticas, HEAD atual da main
        env:
          OPERATION: ${{ needs.gate.outputs.operation }}
          SOURCE: ${{ needs.gate.outputs.source }}
          EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          FRONTEND_CONFIG_JSON: ${{ vars.FRONTEND_CONFIG_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python3 -B .github/scripts/check-deploy-gate.py --stage environment
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.release-id }}
          path: ${{ runner.temp }}/release
      # P-SC1: instalação verificada antes de credenciais, também no deploy que publica e ativa no mesmo job.
      - uses: ./.github/actions/setup-deploy-python
      # O pacote aprovado é revalidado offline: manifesto íntegro e o mesmo release_id do build.
      - name: Revalida o pacote recebido do build
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          BUILT_RELEASE_ID: ${{ needs.build.outputs.release-id }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          python3 -B .github/scripts/validate-release.py --release-dir "$RELEASE_DIR" --public-origin "$PUBLIC_ORIGIN"
          python3 -B .github/scripts/check-publication-approval.py --release-dir "$RELEASE_DIR"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' "$RELEASE_DIR/manifest.json")" = "$BUILT_RELEASE_ID"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - uses: ./.github/actions/publish-release
        with:
          built-release-id: ${{ needs.build.outputs.release-id }}
          expected-main-sha: ${{ needs.gate.outputs.expected-main-sha }}
          release-dir: ${{ runner.temp }}/release
          bucket: ${{ vars.FRONTEND_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
      # Só no deploy, e só depois da publicação conferida: ativação para frente (nunca para trás, sem rollback
      # automático), pelo mesmo caminho testado da operação activate.
      - id: deploy-activate
        if: needs.gate.outputs.operation == 'deploy'
        uses: ./.github/actions/activate-release
        with:
          expected-main-sha: ${{ needs.gate.outputs.expected-main-sha }}
          mode: activate
          release-id: ${{ needs.build.outputs.release-id }}
          bucket: ${{ vars.FRONTEND_BUCKET }}
          distribution-id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          region: ${{ vars.AWS_REGION }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
          record-out: ${{ runner.temp }}/activation-record.json
      # Registro da versão ativa, também em caso de falha depois da escrita do index.html.
      - if: always() && needs.gate.outputs.operation == 'deploy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/activation-record.json
          if-no-files-found: warn
          retention-days: 90

  verify:
    name: Verificar acesso (claims, leituras e sonda opcional)
    needs: gate
    if: needs.gate.outputs.operation == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Variables do environment, sem chaves AWS estáticas, HEAD atual da main
        env:
          OPERATION: ${{ needs.gate.outputs.operation }}
          SOURCE: ${{ needs.gate.outputs.source }}
          EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          FRONTEND_CONFIG_JSON: ${{ vars.FRONTEND_CONFIG_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python3 -B .github/scripts/check-deploy-gate.py --stage environment
      - uses: ./.github/actions/setup-deploy-python
      - name: Claims do token OIDC (sem imprimir o token)
        run: python3 -B .github/scripts/verify-access.py --claims
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - name: Leituras com a role e, se pedida, a sonda S3
        env:
          EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
          GH_TOKEN: ${{ github.token }}
          S3_PROBE: ${{ inputs.s3_probe }}
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          args=(--aws --bucket "$BUCKET" --distribution-id "$DISTRIBUTION_ID" --region "$REGION")
          if [ "$S3_PROBE" = "true" ]; then args+=(--s3-probe); fi
          python3 -B .github/scripts/verify-access.py "${args[@]}"

  activate:
    name: Ativar (${{ needs.gate.outputs.operation }}) uma release publicada
    needs: gate
    if: needs.gate.outputs.operation == 'activate' || needs.gate.outputs.operation == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Variables do environment, sem chaves AWS estáticas, HEAD atual da main
        env:
          OPERATION: ${{ needs.gate.outputs.operation }}
          SOURCE: ${{ needs.gate.outputs.source }}
          EXPECTED_MAIN_SHA: ${{ needs.gate.outputs.expected-main-sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          FRONTEND_CONFIG_JSON: ${{ vars.FRONTEND_CONFIG_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python3 -B .github/scripts/check-deploy-gate.py --stage environment
      - uses: ./.github/actions/setup-deploy-python
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - id: activate
        uses: ./.github/actions/activate-release
        with:
          expected-main-sha: ${{ needs.gate.outputs.expected-main-sha }}
          mode: ${{ needs.gate.outputs.operation }}
          release-id: ${{ inputs.release_id }}
          expected-active: ${{ inputs.expected_active_release }}
          confirm-release-id: ${{ inputs.confirm_release_id }}
          bucket: ${{ vars.FRONTEND_BUCKET }}
          distribution-id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          region: ${{ vars.AWS_REGION }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
          record-out: ${{ runner.temp }}/activation-record.json
      # Registro da versão ativa (passo 10), também em caso de falha depois da escrita do index.html.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/activation-record.json
          if-no-files-found: warn
          retention-days: 90
