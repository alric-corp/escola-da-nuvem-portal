name: CI

on:
  push:
    branches: [main]
  pull_request:

# Os jobs só leem o repositório: o GITHUB_TOKEN não precisa de permissão de escrita.
permissions:
  contents: read

jobs:
  python:
    name: Backend (Python + Moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # O contrato Python reutiliza o parser YAML já instalado nos testes Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Testes do backend
        run: python -m unittest discover -s backend
      - name: Testes de integração (Moto, sem AWS real)
        run: python -m unittest discover -s tests/integration
      - name: Mutações do claim automático (Moto, sem AWS real)
        run: python tests/contracts/claim_mutations.py
      - name: Mutações da autorização manual (Moto, sem AWS real)
        run: python tests/contracts/manual_recovery_mutations.py

  node:
    name: Frontend (Node + Playwright)
    # Temporário: as suítes de navegador medem layout com as fontes do sistema (DejaVu Sans no Linux), e a evidência verde
    # é do Ubuntu 24.04. O rótulo ubuntu-latest passa ao Ubuntu 26 a partir de 19/10/2026. Antes de voltar a ubuntu-latest,
    # validar e recalibrar estas suítes no Ubuntu 26.04 numa execução própria. Os outros jobs não medem layout.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Testes de unidade (sem navegador)
        run: npm test
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Constrói o frontend e roda os testes de navegador
        run: npm run test:browser
      # Reutiliza npm ci e o Chromium acima; muta só cópias temporárias, sem AWS. Mutação sobrevivente sai com código != 0.
      - name: Mutações das leituras assíncronas obsoletas (C7.4, sem AWS real)
        run: python3 tests/contracts/stale_mutations.py
      - name: Mutações de lifecycle do Feedback e dos rascunhos (C7.5, sem AWS real)
        run: python3 tests/contracts/lifecycle_mutations.py

  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # O pytest cria backend/.pytest_cache em execuções locais. O cache simulado prova que o pacote
      # das Lambdas, montado pelo provider archive durante o terraform test, não o inclui.
      - name: Simula o cache local do pytest
        run: mkdir -p ../../backend/.pytest_cache/v/cache && echo '{}' > ../../backend/.pytest_cache/v/cache/lastfailed
      - name: Testes (mock_provider, sem AWS real)
        run: terraform test
      - name: Mutações OpenAPI avaliadas pelo Terraform (mocks, sem AWS real)
        run: python3 ../../tests/contracts/terraform_mutations.py
      - name: Transições e mutações do alias manual (mocks, sem AWS real)
        run: python3 ../../tests/contracts/manual_alias_transitions.py
      - name: Pacote das Lambdas sem o cache do pytest
        run: |
          pacote=$(unzip -Z1 .build/identity.zip)
          echo "$pacote"
          grep -qx 'portal.py' <<< "$pacote"
          if grep -E '(^|/)\.pytest_cache(/|$)' <<< "$pacote"; then
            echo "O cache do pytest entrou no pacote das Lambdas." >&2
            exit 1
          fi
