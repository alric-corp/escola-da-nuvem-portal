name: CI

on:
  push:
    branches: [main]
  pull_request:

# Os jobs só leem o repositório: o GITHUB_TOKEN não precisa de permissão de escrita.
permissions:
  contents: read

jobs:
  python:
    name: Backend (Python + Moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # O contrato Python reutiliza o parser YAML já instalado nos testes Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Testes do backend
        run: python -m unittest discover -s backend
      - name: Testes de integração (Moto, sem AWS real)
        run: python -m unittest discover -s tests/integration

  node:
    name: Frontend (Node + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Testes de unidade (sem navegador)
        run: npm test
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Constrói o frontend e roda os testes de navegador
        run: npm run test:browser

  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # O pytest cria backend/.pytest_cache em execuções locais. O cache simulado prova que o pacote
      # das Lambdas, montado pelo provider archive durante o terraform test, não o inclui.
      - name: Simula o cache local do pytest
        run: mkdir -p ../../backend/.pytest_cache/v/cache && echo '{}' > ../../backend/.pytest_cache/v/cache/lastfailed
      - name: Testes (mock_provider, sem AWS real)
        run: terraform test
      - name: Mutações OpenAPI avaliadas pelo Terraform (mocks, sem AWS real)
        run: python3 ../../tests/contracts/terraform_mutations.py
      - name: Pacote das Lambdas sem o cache do pytest
        run: |
          pacote=$(unzip -Z1 .build/identity.zip)
          echo "$pacote"
          grep -qx 'portal.py' <<< "$pacote"
          if grep -E '(^|/)\.pytest_cache(/|$)' <<< "$pacote"; then
            echo "O cache do pytest entrou no pacote das Lambdas." >&2
            exit 1
          fi
