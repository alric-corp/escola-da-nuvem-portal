name: Publicar a release do frontend
description: >-
  Envia releases/<id>/ com If-None-Match e confere os objetos remotos. Não ativa, não sobrescreve e não apaga.
  Requer Python preparado por setup-deploy-python antes das credenciais da role de deploy (OIDC).
inputs:
  built-release-id:
    description: "Release ID produzido pela construção e validado antes do OIDC"
    required: true
  expected-main-sha:
    description: "SHA esperado da main (do gate: confirmado pelo operador ou o commit do CI); o HEAD atual é revalidado antes da primeira escrita"
    required: true
  release-dir:
    description: "Diretório da release preparada e validada"
    required: true
  bucket:
    description: "Bucket web (variable FRONTEND_BUCKET)"
    required: true
  region:
    description: "Região AWS"
    required: true
outputs:
  release-id:
    description: "Release publicada"
    value: ${{ steps.publish.outputs.release-id }}
runs:
  using: composite
  steps:
    - id: publish
      name: Publica com If-None-Match e confere hashes, MIME e cache remotos
      shell: bash
      env:
        BUILT_RELEASE_ID: ${{ inputs.built-release-id }}
        EXPECTED_MAIN_SHA: ${{ inputs.expected-main-sha }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_DIR: ${{ inputs.release-dir }}
        BUCKET: ${{ inputs.bucket }}
        REGION: ${{ inputs.region }}
      run: python3 -B .github/scripts/publish-release.py --bucket "$BUCKET" --release-dir "$RELEASE_DIR" --region "$REGION"
