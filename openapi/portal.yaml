      operationId: pendingPreview
      summary: Consultar detalhe e prévia de lembrete
      tags:
        - reminders
      x-portal-backend-operation: Portal._reminder_flow
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
              additionalProperties: false
              properties:
                studentId: {}
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/pending-preview-batch:
    post:
      operationId: previewReminderBatch
      summary: Preparar prévia de lembretes em lote
      tags:
        - reminders
      x-portal-backend-operation: Portal._reminder_batch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentIds
              additionalProperties: false
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/preview:
    post:
      operationId: previewImport
      summary: Criar prévia de importação CSV
      description: Cria um rascunho persistido. Regras detalhadas do CSV e da integridade continuam no backend.
      tags:
        - import
      x-portal-backend-operation: Portal._preview
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - csv
              properties:
                csv:
                  type: string
                filename:
                  description: Convertido para string, truncado em 150 caracteres; padrão notas.csv.
                activeIds:
                  description: Seleção opcional de atividades; validação detalhada permanece em grades.parse_csv.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/publish:
    post:
      operationId: publish
      summary: Publicar prévia de importação
      tags:
        - import
      x-portal-backend-operation: Portal._publish
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                draftId:
                  description: Convertido para string; identifica uma prévia da própria conta.
                acknowledgeRemoved:
                  description: Precisa ser exatamente true quando a publicação remove alunos.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/reminder-settings:
    get:
      operationId: getReminderSettings
      summary: Consultar disponibilidade do remetente
      tags:
        - reminders
      x-portal-backend-operation: Portal._reminder_settings
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/report:
    get:
      operationId: getCohortReport
      summary: Consultar relatório da turma ou do próprio aluno
      description: O relatório varia conforme o papel. A consulta do próprio aluno pode criar o vínculo de conta; o método HTTP GET não significa ausência absoluta de efeitos internos.
      tags:
        - grades
      x-portal-backend-operation: Portal._report
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
