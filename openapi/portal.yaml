# Gerado por npm run openapi:bundle. Edite openapi/src/; não edite este arquivo.
openapi: 3.0.3
info:
  title: Escola da Nuvem Portal API
  version: 1.0.0
  description: Contrato HTTP das rotas publicadas do portal. API-1 caracteriza o runtime existente; validação e autorização de negócio permanecem no backend.
tags:
  - name: access
  - name: cohorts
  - name: grades
  - name: reminders
  - name: import
  - name: feedback
paths:
  /access-request:
    post:
      operationId: requestInstructorAccess
      summary: Solicitar acesso de instrutor
      tags:
        - access
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /admin/feedback:
    get:
      operationId: listAdminFeedback
      summary: Listar feedbacks para administração
      description: Sem filtro de status, exclui ARCHIVED. ALL inclui todos.
      tags:
        - feedback
      x-portal-backend-operation: Portal._admin_feedback
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: limit
          in: query
          description: Dígitos entre 1 e 100; padrão 50.
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor opaco devolvido em nextCursor.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ALL
              - NEW
              - IN_REVIEW
              - RESOLVED
              - ARCHIVED
        - name: type
          in: query
          schema:
            type: string
            enum:
              - BUG
              - SUGGESTION
              - IMPROVEMENT
              - OTHER
        - name: cohort
          in: query
          schema:
            type: string
            pattern: ^[A-Z0-9-]{3,32}$
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /admin/feedback/{id}/status:
    post:
      operationId: setFeedbackStatus
      summary: Alterar status do feedback
      tags:
        - feedback
      x-portal-backend-operation: Portal._feedback_status
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - expectedStatus
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                    - NEW
                    - IN_REVIEW
                    - RESOLVED
                    - ARCHIVED
                expectedStatus:
                  type: string
                  enum:
                    - NEW
                    - IN_REVIEW
                    - RESOLVED
                    - ARCHIVED
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts:
    get:
      operationId: listCohorts
      summary: Listar turmas acessíveis
      tags:
        - cohorts
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      operationId: createCohort
      summary: Criar turma
      tags:
        - cohorts
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  description: Convertido para string, aparado e convertido para maiúsculas; 3–32 caracteres A-Z, 0-9 ou hífen.
                name:
                  description: Convertido para string e aparado; 1–100 caracteres. Na ausência, usa code.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/class-report:
    get:
      operationId: getCohortClassReport
      summary: Consultar notas da turma
      tags:
        - grades
      x-portal-backend-operation: class_report
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/display-name:
    post:
      operationId: setDisplayName
      summary: Alterar nome de exibição
      tags:
        - access
      x-portal-backend-operation: Portal._set_display_name
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - canvasId
                - displayName
              additionalProperties: false
              properties:
                canvasId: {}
                displayName:
                  description: Convertido para string, aparado, 1–100 caracteres.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/focus-activities:
    post:
      operationId: saveFocus
      summary: Salvar atividades em foco
      tags:
        - grades
      x-portal-backend-operation: Portal._focus_activities
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activityIds
              properties:
                activityIds:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  uniqueItems: true
                expectedCurrent:
                  description: Deve corresponder à publicação atual.
                expectedVersion:
                  description: Deve corresponder à versão do foco; ausência equivale a None no backend.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/instructors:
    get:
      operationId: listInstructors
      summary: Listar instrutores da turma
      tags:
        - access
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      operationId: addInstructor
      summary: Aprovar instrutor na turma
      tags:
        - access
      x-portal-backend-operation: Portal._approve_instructor
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  description: Convertido para string; deve identificar uma solicitação institucional.
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/participation:
    post:
      operationId: setParticipation
      summary: Alterar participação na turma
      description: Requer permissão de instrutor na turma. expectedStatus deve corresponder ao estado atual antes da verificação de idempotência. Ausência de registro equivale a ACTIVE. Pedir o status atual retorna 200 sem escrita; updatedAt é null para ACTIVE sem registro. Não remove notas nem dados do Canvas.
      tags:
        - cohorts
      x-portal-backend-operation: Portal._set_participation
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationRequest'
      responses:
        '200':
          description: Operação concluída; estrutura detalhada continua caracterizada pelos testes do backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /cohorts/{code}/pending-preview:
