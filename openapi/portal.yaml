          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /requests:
    get:
      operationId: listAccessRequests
      summary: Listar solicitações de acesso
      tags:
        - access
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /requests/{userId}/reject:
    post:
      operationId: rejectRequest
      summary: Recusar solicitação pendente
      tags:
        - access
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          $ref: '#/components/responses/SuccessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    PortalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do portal. Emissor, audiência e authorizer são configuração de ambiente; scopes são declarados em x-portal-authorization-scopes.
  responses:
    BadRequest:
      description: JSON, parâmetros ou validação de entrada recusados pelo backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente ou inválido; resposta do authorizer ou do backend.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/GatewayErrorResponse'
    Forbidden:
      description: Scope, identidade verificada, papel ou autorização de negócio insuficientes.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/GatewayErrorResponse'
    NotFound:
      description: Recurso não encontrado ou ocultado ao solicitante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Estado atual, concorrência ou pré-condição da operação impedem a solicitação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Corpo decodificado excede 4.000.000 bytes no wrapper portal.handler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Throttling do API Gateway; criar feedback também possui limite por usuário.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/GatewayErrorResponse'
    InternalError:
      description: Exceção inesperada tratada por portal.handler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Verificação de identidade, anexos ou envio temporariamente indisponíveis. Falhas de integração podem ter corpo não JSON, conforme tratamento de api.js.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/html:
          schema:
            type: string
    SuccessObject:
      description: Operação concluída. Objeto JSON; campos detalhados permanecem caracterizados pelos testes do backend nesta fase.
      content:
        application/json:
          schema:
            type: object
    BadGateway:
      description: Falha de integração tratada pelo frontend (api.js e tests/api.mjs). Conclusão de anexo também retorna 502 em falha de promoção. O corpo pode não ser JSON; não se exige formato único.
    GatewayTimeout:
      description: Timeout de integração tratado pelo frontend (api.js e tests/api.mjs). Corpo não caracterizado nesta fase; não há resposta 504 explícita de portal.handler.
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    GatewayErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ParticipationRequest:
      type: object
      required:
        - canvasId
        - status
        - expectedStatus
      additionalProperties: false
      properties:
        canvasId:
          type: string
          minLength: 1
          maxLength: 32
          description: Identificador tratado como string; o backend exige dígitos com re.fullmatch do Python.
        status:
          type: string
          enum:
            - ACTIVE
            - WITHDRAWN
        expectedStatus:
          type: string
          enum:
            - ACTIVE
            - WITHDRAWN
    ParticipationResponse:
      type: object
      required:
        - canvasId
        - participationStatus
        - updatedAt
      properties:
        canvasId:
          type: string
        participationStatus:
          type: string
          enum:
            - ACTIVE
            - WITHDRAWN
        updatedAt:
          type: string
          nullable: true
          description: Instante armazenado da última alteração; null quando ACTIVE não possui registro.
    CanvasActivityProvenance:
      type: object
      description: Proveniência de um campo auxiliar. Retenção não renova a observação; a referência global legada não comprova o instante preciso em que o valor foi observado.
      properties:
        status:
          type: string
          enum:
            - current
            - retained
            - unknown
        observedAt:
          type: string
          format: date-time
          nullable: true
          description: Instante de observação de um valor válido deste campo; desconhecido em registros legados.
        referenceAt:
          type: string
          format: date-time
          nullable: true
          description: Referência histórica global disponível, sem precisão de observação por campo.
        attemptedAt:
          type: string
          format: date-time
          nullable: true
          description: Início da tentativa de coleta, inclusive quando não observou um valor válido.
        lastValidObservedAt:
          type: string
          format: date-time
          nullable: true
          description: Última observação válida conhecida, mesmo quando null explícito tornou o valor indisponível.
        reason:
          type: string
          nullable: true
          description: Limitação da coleta, como missing, invalid, null, failed, incomplete ou legacy.
    CanvasActivity:
      type: object
      description: Campos opcionais somente no relatório autorizado de instrutor/admin. Tempo acumulado registrado no curso não equivale a tempo efetivo de estudo. Zero é válido; null é desconhecido.
      properties:
        totalActivityTime:
          type: integer
          minimum: 0
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Última atividade conhecida; não comprova ausência de interação após a observação.
        collectedAt:
          type: string
          format: date-time
          nullable: true
          description: Última coleta completa ou referência legada. Use a proveniência independente de cada campo.
        provenance:
          type: object
          properties:
            totalActivityTime:
              $ref: '#/components/schemas/CanvasActivityProvenance'
            lastActivityAt:
              $ref: '#/components/schemas/CanvasActivityProvenance'
    CanvasEngagement:
      type: object
      description: Qualidade da coleta auxiliar, independente da atualização acadêmica. Omitido quando não há registro deste curso; leitores devem tolerar campos ausentes e registros antigos.
      properties:
        courseId:
          type: string
        collectedAt:
          type: string
          format: date-time
          nullable: true
        attemptedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - complete
            - partial
            - failed
            - legacy
    CohortReport:
      type: object
      description: O formato acadêmico permanece caracterizado pelos testes existentes. Estas propriedades auxiliares são aditivas e aparecem somente no ramo de instrutor/admin; o relatório individual não as expõe.
      properties:
        canvasEngagement:
          $ref: '#/components/schemas/CanvasEngagement'
        students:
          type: array
          items:
            type: object
            properties:
              canvasActivity:
                $ref: '#/components/schemas/CanvasActivity'
