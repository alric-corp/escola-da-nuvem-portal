paths:
  /access-request:
    post:
      operationId: requestInstructorAccess
      summary: Solicitar acesso de instrutor
      tags:
        - access
      x-portal-backend-operation: Portal.dispatch
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          $ref: ../components/responses.yaml#/SuccessObject
        "400":
          $ref: ../components/responses.yaml#/BadRequest
        "401":
          $ref: ../components/responses.yaml#/Unauthorized
        "403":
          $ref: ../components/responses.yaml#/Forbidden
        "409":
          $ref: ../components/responses.yaml#/Conflict
        "413":
          $ref: ../components/responses.yaml#/PayloadTooLarge
        "429":
          $ref: ../components/responses.yaml#/TooManyRequests
        "500":
          $ref: ../components/responses.yaml#/InternalError
        "502":
          $ref: ../components/responses.yaml#/BadGateway
        "503":
          $ref: ../components/responses.yaml#/ServiceUnavailable
        "504":
          $ref: ../components/responses.yaml#/GatewayTimeout
  /cohorts/{code}/display-name:
    post:
      operationId: setDisplayName
      summary: Alterar nome de exibição
      tags:
        - access
      x-portal-backend-operation: Portal._set_display_name
      security:
        - PortalJwt: []
      x-portal-authorization-scopes:
        - portal/access
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - canvasId
                - displayName
              additionalProperties: false
              properties:
                canvasId: {}
                displayName:
                  description: Convertido para string, aparado, 1–100 caracteres.
      responses:
        "200":
          $ref: ../components/responses.yaml#/SuccessObject
        "400":
          $ref: ../components/responses.yaml#/BadRequest
        "401":
          $ref: ../components/responses.yaml#/Unauthorized
        "403":
          $ref: ../components/responses.yaml#/Forbidden
        "404":
          $ref: ../components/responses.yaml#/NotFound
        "409":
          $ref: ../components/responses.yaml#/Conflict
        "413":
          $ref: ../components/responses.yaml#/PayloadTooLarge
        "429":
          $ref: ../components/responses.yaml#/TooManyRequests
        "500":
          $ref: ../components/responses.yaml#/InternalError
        "502":
          $ref: ../components/responses.yaml#/BadGateway
        "503":
          $ref: ../components/responses.yaml#/ServiceUnavailable
        "504":
          $ref: ../components/responses.yaml#/GatewayTimeout
